name: PR Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter on purpose. A PR stacked on another branch is still
    # code heading for main, one hop later, and base-filtering left it ungated
    # for its whole review -- found when a stacked PR under review could not
    # earn a single check. The retarget half of that same gap was already closed
    # by the `edited` type below; this is the other half.
    #
    # An allow-list of base patterns was considered and rejected: it needs
    # extending every time someone stacks, and forgetting to extend it fails
    # silently in the direction of no gate.
    #
    # Note the `on:` filters are read from the workflow file in the PR's OWN
    # branch, not from main, so this only gates a stacked PR once the branch has
    # picked the change up.
    #
    # Explicit types because the default set is opened/synchronize/reopened,
    # which omits `edited`. Retargeting a PR (changing its base branch) fires
    # `edited` and nothing else, so a stacked PR moved onto main used to sit
    # with no checks at all until it was closed and reopened.
    #
    # `edited` also fires on a title or body edit, so those re-run the suite
    # too. Gating on github.event.changes.base is not an option here:
    # all-checks-passed runs with if: always() and treats any non-success
    # result -- including `skipped` -- as a failure, so skipping the jobs would
    # report the PR red rather than leaving it untouched.
    types: [opened, synchronize, reopened, edited]

# One run at a time, across every pull request and every push to main, queued
# first in, first out. Overlapping runs share the self-hosted runners, and that
# overlap is what pushed full-transpile tests past vitest's 5s default (#1564,
# #1752). A run on its own has all of them.
#
# A fork's pull request queues in a group of its own, keyed by its number. Its
# runs never touch the self-hosted runners (see `runs-on:` below), so the shared
# queue has nothing to protect from them -- and in the shared queue, anyone able
# to open a pull request could fill all 100 places by editing its body, holding
# every trusted run behind theirs and getting the next push to main cancelled.
# The predicate is the one `runs-on:` uses, so the queue and the runners agree
# on which runs are trusted.
#
# `queue: max` holds up to 100 waiting runs; GitHub cancels a run that arrives
# at a full queue. It orders the queue by when each run started waiting, and
# documents that order as not guaranteed.
#
# `queue: max` cannot be combined with `cancel-in-progress: true`, so a newer
# run of a pull request no longer cancels the older one from here. The
# `supersede` job does it instead, when the older run reaches the front of the
# queue: if a newer run of the same pull request is waiting, the older run
# cancels itself before any other job starts. A push or a body edit therefore
# costs no extra turn while its predecessor is still waiting. A predecessor
# already running finishes first -- nothing can cancel it, because the newer
# run is itself waiting. Pushes to main are never superseded.
#
# all-checks-passed keeps `if: always()`, so a cancelled run still reports a
# red "All Checks Passed" rather than a skip -- a cancellation must never read
# as a pass. The newer run's check of the same name supersedes it.
concurrency:
  group: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'pr-checks' || format('pr-checks-fork-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
  queue: max

# Self-hosted runner for trusted code (your branches, pushes to main)
# GitHub runners for untrusted code (fork PRs), pinned to `ubuntu-24.04`: apt
# installs the cross toolchains for the runner's own release, and
# `ubuntu-latest` became 26.04, whose avr-gcc the target catalog does not
# describe (see .github/actions/cross-toolchains).
#
# Issue #1421: that split decides whether caching ~/.npm is a win or a tax, so
# every `Cache npm dependencies` step below is gated on `runner.environment`.
#
# A GitHub-hosted runner is a fresh VM with an empty ~/.npm, so restoring the
# cache is a clear win. A self-hosted runner is not ephemeral: all 8 runners
# share one persistent ~/.npm (2.9 GB and warm), which is why `npm ci` there
# takes 5-9s with no remote cache at all. Restoring anyway cost 138-324s per
# job to save ~4s of install time.
#
# It scaled badly rather than merely wastefully. The step runs in 11 of the 16
# jobs (7 single jobs + the 4-way c-validation matrix), so each run pulled
# ~9.2 GB. At 1-3 concurrent runs that hid inside an 80s step; at 9-15
# concurrent runs it saturated the uplink and stretched to ~500s per job,
# taking runs from ~8 minutes to 30-160 while the 32 cores sat idle. No commit
# caused it -- concurrency rose and a fixed cost stopped fitting.

jobs:
  # ============================================================================
  # STAGE 0: Cancel this run if a newer run of the same pull request is waiting
  # ============================================================================
  # Runs once this run reaches the front of the queue (see `concurrency:`).
  # lint and build need it, so nothing else starts on a superseded run.
  #
  # A newer run counts only when it unambiguously belongs to this pull request:
  # its `pull_requests` names this one and no other. That field lists every open
  # pull request whose head matches the run, not the one that triggered it, so
  # two open pull requests from one head branch list each other and neither is
  # superseded. A fork's runs list none, so a fork's run is never superseded.
  # Both fall back to running in full, which wastes a turn and blocks nothing.
  #
  # A newer run that was itself cancelled does not count: a run never stands
  # down in favor of one that will not report.
  #
  # Reading the runs fails OPEN. On an API error the checks run, because this
  # job only saves queue time and must never be the reason a pull request is
  # red.
  #
  # The script reads the pull request from `context.payload`, never from a
  # `${{ }}` expression, so a branch name cannot inject code into it.
  supersede:
    name: Superseded Run Check
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    permissions:
      actions: write # to cancel this run

    steps:
      - name: Cancel if a newer run of this pull request is waiting
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            let runs;
            try {
              const current = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: context.runId,
              });
              runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: current.data.workflow_id,
                event: "pull_request",
                branch: context.payload.pull_request.head.ref,
                per_page: 100,
              });
            } catch (error) {
              core.warning(`Could not list runs, so this run proceeds: ${error.message}`);
              return;
            }

            const newer = runs.filter(
              (run) =>
                run.run_number > context.runNumber &&
                run.conclusion !== "cancelled" &&
                run.pull_requests.length === 1 &&
                run.pull_requests[0].number === pullNumber,
            );
            if (newer.length === 0) return;

            const numbers = newer.map((run) => `#${run.run_number}`).join(", ");
            core.notice(`Superseded by run ${numbers} of pull request #${pullNumber}; cancelling.`);
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            // The runner stops this step when the cancellation lands. Until
            // then, holding it keeps lint and build from starting.
            await new Promise((resolve) => setTimeout(resolve, 5 * 60 * 1000));
            core.setFailed("Cancellation was requested five minutes ago and has not landed.");

  # ============================================================================
  # STAGE 1 (parallel): Build + Lint
  # ============================================================================
  lint:
    name: Static Analysis
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [supersede]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # The scope-context matrix below transpiles every fixture, and a fixture
      # pinned to a cross target reads its headers with that target's
      # preprocessor: without arm-none-eabi-gcc it stops at E0516 and never
      # reaches the diagnostic its cell expects. The self-hosted runner has
      # the toolchains already.
      - name: Install the target matrix's cross toolchains
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/cross-toolchains

      # Issue #1364: `.prettierrc` loads the cnx plugin, so Prettier cannot
      # check a .cnx file until the plugin is built. `npm ci` runs `prepare`,
      # which installs and builds it from the committed grammar -- the same path
      # a contributor gets from a plain `npm install`, so CI cannot pass on a
      # setup they do not have.
      - name: Check formatting (Prettier)
        id: prettier
        run: npm run prettier:check
        continue-on-error: true

      - name: Test Prettier plugin
        id: plugintest
        run: npm run plugin:test
        continue-on-error: true

      - name: Check spelling (cspell)
        id: cspell
        run: npm run cspell:check
        continue-on-error: true

      - name: Check linting (oxlint)
        id: oxlint
        run: npm run oxlint:check
        continue-on-error: true

      - name: Check for dead code (knip)
        id: knip
        run: npx knip
        continue-on-error: true

      - name: Check architecture boundaries (dependency-cruiser)
        id: depcruise
        run: npm run depcruise
        continue-on-error: true

      - name: Check test file locations
        id: testlocation
        run: npm run lint:test-location
        continue-on-error: true

      - name: Check code duplication (jscpd)
        id: jscpd
        run: npm run analyze:duplication
        continue-on-error: true

      # Issue #1143: docs/compatibility.md and the generated block in
      # docs/misra-compliance.md are derived from the transpiler's requirements
      # registry. Verify Clean cannot catch staleness here -- it runs no
      # generators, only re-downloads build artifacts -- so the diff is checked
      # explicitly, which also gives a precise message instead of
      # "uncommitted changes".
      - name: Check toolchain documentation is in sync
        id: toolchaindocs
        run: npm run docs:toolchain:check
        continue-on-error: true

      # Issue #1610: Rule 11.9 read "By Design" while generated C wrote
      # `Dev* d = {0};` at six sites, because cppcheck's addon cannot see that
      # shape and nothing said so. Every Enforced or By Design row of
      # docs/misra-compliance.md names a guard that exists, or the open issue
      # tracking that it has none.
      - name: Check MISRA compliance claims name a guard
        id: misraguards
        run: npm run docs:misra-guards:check
        # It reads whether each issue a guard-less row names is still open
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      # Issue #1219: the scope-context matrix. Occupancy is derived from the
      # fixture corpus and the obligation for each cell is declared by the ADR
      # that owns it, so docs/scope-context-matrix.md is generated and must be
      # checked for staleness here -- Verify Clean runs no generators. The same
      # command also fails when a cell an ADR declared `error` has no fixture.
      - name: Check scope-context test matrix
        id: scopematrix
        run: npm run coverage:matrix:check
        continue-on-error: true

      # Issue #1403: an ADR must stay applicable if the transpiler were rebuilt
      # in another language and stack. The prohibition lived in CLAUDE.md with
      # no gate and 40 of 76 ADRs drifted past it -- five written after it was
      # recorded. The identifier vocabulary is derived from src/ on each run, so
      # there is no denylist to keep in sync.
      - name: Check ADRs survive a rewrite
        id: adrindependence
        run: npm run adr:independence:check
        continue-on-error: true

      # The start-issue hook's own test suite. It was committed with #1423 and
      # run by nothing -- not CI, not package.json, not gate.sh -- so its
      # negative controls could not have caught a regression. Green at 17/17
      # when wired in; a test nobody runs is the #1143 inert-guard shape.
      - name: Check hook tests
        id: hooktests
        run: npm run test:hooks
        continue-on-error: true

      # Issue #1416: `gh issue list` and `gh pr list` default to 30 and REST
      # collections page at 30, and a filter over a truncated page returns a
      # shorter answer rather than an error. It shipped twice in one file --
      # the second time the in-flight detector reported no assigned issues
      # while one was assigned, in WIP, and 34 minutes old, and recommended it
      # as free work. There is no exemption mechanism.
      - name: Check gh reads are bounded
        id: ghpagination
        run: npm run gh:pagination:check
        continue-on-error: true

      # Issue #1316: a `.expected.error` is the only assertion that a diagnostic
      # fires, and losing one was silent -- `--update` unlinked it and reported
      # the run green. docs/diagnostic-manifest.md is the committed record, so
      # the loss becomes a reviewable diff. Gated here rather than in test:all,
      # which must stay free of update steps to remain a gate.
      - name: Check diagnostic manifest
        id: diagnosticmanifest
        run: npm run diagnostics:manifest:check
        continue-on-error: true

      # Issue #1322: docs/error-codes.md says of itself that it "is
      # hand-maintained and has no gate", so a code reserved in one place and
      # recorded nowhere is assigned a second time and the collision is silent.
      # Tolerable at 55 codes growing by one a release; #1322 allocates ~45-60
      # at once across eight ranges with eight reserved-do-not-reuse entries.
      - name: Check error-code registry
        id: errorcodes
        run: npm run error-codes:check
        continue-on-error: true

      # Issue #1365: docs/architecture/throw-classification.md cites every
      # throw site in src/ (output/ until #1531) by file:line, and a line number decays
      # silently. #1362
      # committed it correct; #1363 then added 62 lines to TypeValidator.ts and
      # 64 citations began pointing at a docstring. Each PR was green alone, and
      # main is unprotected (#1344), so nothing evaluated the pair. This also
      # fails when a new throw is added and nobody classifies it.
      - name: Check throw classification citations
        id: throwcitations
        run: npm run docs:throw-citations:check
        continue-on-error: true

      # Issue #1357: the population of `fromParts([scopeName, ...])` sites, which
      # claim a complete path while supplying a scope LEAF. No import-level rule
      # can see this -- `fromParts` has 38 legitimate whole-path callers -- and
      # the type system already rejects the honest mistake, so what is left is a
      # call shape. Keyed on per-file COUNTS, not file:line, because #1374 records
      # that a citation gate cannot detect two rows trading sites, and because a
      # single unrelated change silently invalidated 18 citations in the throw
      # classification document through pure line drift.
      - name: Check scope-join site population
        id: scopejoins
        run: npm run scope-joins:check
        continue-on-error: true

      # Issue #1317: docs/architecture/README.md rests the AST's whole lifetime
      # axis on one rule -- 1.3 consumes ParsedFile and does not re-export it --
      # and nothing enforced it. The population and its per-layer split live in
      # docs/architecture/parse-tree-sites.md rather than in this comment, which
      # would be an ungated reading that rots. The depcruise rule is `warn`
      # because some holders are correct (IParsedFile IS 1.2's artifact); what
      # must not happen is the count RISING, which is what this gates. The
      # population is the rule's own violation set, so the rule and the baseline
      # cannot drift apart into a module gated by neither.
      - name: Check parse-tree confinement baseline
        id: parsetree
        run: npm run parse-tree:check
        continue-on-error: true

      # Issue #1556: `noUnusedLocals` cannot live in tsconfig.json -- ANTLR's
      # committed parsers carry unused locals and must not be hand-edited, and
      # TypeScript has no per-directory flag. The check runs the compiler with
      # the flag and drops generated output from the result.
      - name: Check for unused declarations in authored code
        id: unusedcode
        run: npm run unused-code:check
        continue-on-error: true

      # Issue #1552: an ADR-029 `_fp` typedef must carry the same const its
      # function's prototype carries, or the two are incompatible pointer types
      # -- and when a declaring and a using file disagree, one translation unit
      # holds two definitions of one name and cc rejects it at transpile exit 0.
      # Fixtures could not see this: the contexts were occupied while the
      # property was untested, because the fixture holding them took no
      # parameters and its two typedefs were byte-identical.
      - name: Check `_fp` typedef const matches its prototype
        id: typedefconst
        run: npm run typedef-const:parity:check
        continue-on-error: true

      # Issue #1443: src/ is the pass table. Its first two levels are exactly
      # the tree docs/architecture/README.md §1 draws, and no module reaches a
      # later pass. It replaces #1653's destination map, which tracked modules
      # still on their way; none is.
      - name: Check src/ is the pass table
        id: layout
        run: npm run layout:check
        continue-on-error: true

      # Issue #1934: 2.2 Plan reads nothing 2.3 Render writes (#1313 box 3). It
      # was a measurement kept in an issue comment, so nothing failed when a
      # Plan module started reading a field Render sets. ts-morph references
      # over every TranspileState member, with a probe of three known writes as
      # the control, so a detector that sees nothing cannot report clean.
      - name: Check 2.2 Plan reads nothing 2.3 Render writes
        id: planrenderstate
        run: npm run plan-render-state:check
        continue-on-error: true

      # Issue #1526: the roster in CLAUDE.md is a list that reads as complete,
      # and it drifted three times in silence. The command it offered as proof
      # was itself wrong twice in ways that cancelled -- it matched the
      # `run_check` function definition while missing the one check that
      # open-coded its own bookkeeping. This derives the claim instead: it
      # counts invocations, diffs the npm scripts CI runs against the ones the
      # gate runs, and asserts the numerals in the paragraph.
      - name: Check the gate roster matches what runs
        id: gateroster
        run: npm run gate:roster:check
        continue-on-error: true

      - name: Report results
        if: always()
        run: |
          FAILED=0
          [ "${{ steps.prettier.outcome }}" != "success" ] && echo "❌ Prettier" && FAILED=1 || echo "✅ Prettier"
          [ "${{ steps.plugintest.outcome }}" != "success" ] && echo "❌ Prettier plugin tests" && FAILED=1 || echo "✅ Prettier plugin tests"
          [ "${{ steps.cspell.outcome }}" != "success" ] && echo "❌ Spelling" && FAILED=1 || echo "✅ Spelling"
          [ "${{ steps.oxlint.outcome }}" != "success" ] && echo "❌ oxlint" && FAILED=1 || echo "✅ oxlint"
          [ "${{ steps.knip.outcome }}" != "success" ] && echo "❌ Dead code (knip)" && FAILED=1 || echo "✅ Dead code (knip)"
          [ "${{ steps.depcruise.outcome }}" != "success" ] && echo "❌ Architecture (depcruise)" && FAILED=1 || echo "✅ Architecture (depcruise)"
          [ "${{ steps.testlocation.outcome }}" != "success" ] && echo "❌ Test file locations" && FAILED=1 || echo "✅ Test file locations"
          [ "${{ steps.jscpd.outcome }}" != "success" ] && echo "❌ Code duplication (jscpd)" && FAILED=1 || echo "✅ Code duplication (jscpd)"
          [ "${{ steps.toolchaindocs.outcome }}" != "success" ] && echo "❌ Toolchain docs" && FAILED=1 || echo "✅ Toolchain docs"
          [ "${{ steps.misraguards.outcome }}" != "success" ] && echo "❌ MISRA guards" && FAILED=1 || echo "✅ MISRA guards"
          [ "${{ steps.scopematrix.outcome }}" != "success" ] && echo "❌ Scope-context matrix" && FAILED=1 || echo "✅ Scope-context matrix"
          [ "${{ steps.adrindependence.outcome }}" != "success" ] && echo "❌ ADR rewrite test" && FAILED=1 || echo "✅ ADR rewrite test"
          [ "${{ steps.ghpagination.outcome }}" != "success" ] && echo "❌ Bounded gh reads" && FAILED=1 || echo "✅ Bounded gh reads"
          [ "${{ steps.hooktests.outcome }}" != "success" ] && echo "❌ Hook tests" && FAILED=1 || echo "✅ Hook tests"
          [ "${{ steps.diagnosticmanifest.outcome }}" != "success" ] && echo "❌ Diagnostic manifest" && FAILED=1 || echo "✅ Diagnostic manifest"
          [ "${{ steps.errorcodes.outcome }}" != "success" ] && echo "❌ Error-code registry" && FAILED=1 || echo "✅ Error-code registry"
          [ "${{ steps.throwcitations.outcome }}" != "success" ] && echo "❌ Throw citations" && FAILED=1 || echo "✅ Throw citations"
          [ "${{ steps.scopejoins.outcome }}" != "success" ] && echo "❌ Scope-join sites" && FAILED=1 || echo "✅ Scope-join sites"
          [ "${{ steps.parsetree.outcome }}" != "success" ] && echo "❌ Parse-tree baseline" && FAILED=1 || echo "✅ Parse-tree baseline"
          [ "${{ steps.unusedcode.outcome }}" != "success" ] && echo "❌ Unused declarations" && FAILED=1 || echo "✅ Unused declarations"
          [ "${{ steps.typedefconst.outcome }}" != "success" ] && echo "❌ Typedef const parity" && FAILED=1 || echo "✅ Typedef const parity"
          [ "${{ steps.layout.outcome }}" != "success" ] && echo "❌ Pass-table layout" && FAILED=1 || echo "✅ Pass-table layout"
          [ "${{ steps.planrenderstate.outcome }}" != "success" ] && echo "❌ Plan reads no Render state" && FAILED=1 || echo "✅ Plan reads no Render state"
          [ "${{ steps.gateroster.outcome }}" != "success" ] && echo "❌ Gate roster" && FAILED=1 || echo "✅ Gate roster"
          [ $FAILED -eq 1 ] && exit 1 || exit 0

  build:
    name: Build
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [supersede]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Generate parser files
        run: npm run antlr:all

      - name: Build transpiler bundle
        run: npm run build

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Check Prettier plugin types
        run: npx tsc --noEmit -p prettier-plugin/tsconfig.json

      # scripts/ is outside tsconfig.json's `include`, so the test harness and
      # every gate the lint job runs were never typechecked -- which is how a
      # statically detectable TS2339 shipped in a scripts/ tool and left it
      # unable to do its one job (#1489).
      - name: Check scripts types
        run: npm run typecheck:scripts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          path: |
            dist/
            prettier-plugin/dist/
            src/cnx/PARSE/2-Parse/grammar/
            src/cnx/PARSE/2-Parse/c/grammar/
            src/cnx/PARSE/2-Parse/cpp/grammar/

  # ============================================================================
  # STAGE 2: Integration tests — full pipeline (transpile + compile + execute)
  # in one pass, so every test-execution test is re-transpiled in the same run
  # that compiles and executes it (Issue #1018). Also generates the C/C++ files
  # consumed by the static-analysis stage.
  #
  # Covers tests/bugs/ (per-issue regression fixtures) too: those used to live in
  # a top-level bugs/ tree with its own job, which no local script ran (#1142).
  # ============================================================================
  integration:
    name: Integration Tests
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install the target matrix's cross toolchains
        # #1668 box 13: every fixture is also compiled for a Cortex-M and an
        # AVR, against their real C libraries. The runner's preflight fails the
        # run if one is missing rather than skipping its cells. The list is the
        # one the preflight's error message names.
        uses: ./.github/actions/cross-toolchains

      - name: Run integration tests (transpile + compile + execute)
        # Covers tests/bugs/ regression fixtures — same command a developer runs.
        run: npm test

      - name: Every generated header compiles on its own
        # In the blocking `integration` job, not `c-validation`, which is
        # ADVISORY -- its result never sets FAILED, so a gate placed there
        # could not fail a pull request. This job also provably has gcc and
        # g++, because the step above compiles every fixture with them.
        run: npm run headers:standalone:check

      - name: Re-run warm — a warm .cnx cache must produce identical output
        # Issue #1225: the run above populates .cnx/, so this one reads it. CI
        # otherwise only ever sees a cold cache (fresh checkout, .cnx gitignored),
        # which is why four cache-fidelity bugs reached main green.
        #
        # --transpile-only skips compile/execute: the divergence this guards is
        # in generated text, so transpile + snapshot comparison catches it in
        # full, at a fraction of the wall clock.
        run: |
          npm test -- --transpile-only
          git diff --exit-code tests/

      - name: Upload generated test files
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-files
          retention-days: 1
          path: |
            tests/**/*.test.c
            tests/**/*.test.cpp
            tests/**/*.test.h
            tests/**/*.test.hpp

  unit-tests:
    name: Unit Tests
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for SonarCloud blame data

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Unit tests transpile and compile the cross-target examples
      # (examples/teensy4, examples/nucleo-f446re) and read headers with a
      # cross preprocessor. The self-hosted runner has the toolchains already.
      - name: Install the target matrix's cross toolchains
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/cross-toolchains

      - name: Run unit tests with coverage
        run: npm run unit -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage

  cli-tests:
    name: CLI Tests
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # "Verify transpiler CLI" transpiles examples/teensy4/blink.cnx, a
      # Cortex-M7 program whose <Arduino.h> only arm-none-eabi-gcc's
      # preprocessor reads; without it the run stops at E0516. The
      # self-hosted runner has the toolchains already.
      - name: Install the target matrix's cross toolchains
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/cross-toolchains

      - name: Run CLI integration tests
        run: npm run test:cli

      - name: Verify transpiler CLI
        run: |
          # #1450: remove first, and assert the HEADER too. `test -f` over a
          # committed file proves it exists, not that this run wrote it -- a
          # break in the Stage 6 header write passed this step with the stale
          # file on disk. Kept in step with scripts/gate.sh's "cli smoke".
          rm -f examples/teensy4/blink.c examples/teensy4/blink.h
          node dist/index.js examples/teensy4/blink.cnx
          test -f examples/teensy4/blink.c || exit 1
          test -f examples/teensy4/blink.h || exit 1
          # Verify Clean is its own job and runs no generator, so a stale
          # committed example is caught here, where it is regenerated.
          git diff --exit-code examples/teensy4/

  grammar-coverage:
    name: Grammar Coverage
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Check grammar coverage
        run: npm run coverage:grammar:check -- --threshold 80

  # ============================================================================
  # Issue #1364: the formatter must not change what the code means.
  #
  # Formats every fixture in the corpus and asserts the transpiler produces
  # byte-identical output and the same diagnostics from the formatted source, that
  # every comment survives verbatim, and that formatting is idempotent. This is
  # what makes reformatting 1000+ committed fixtures a mechanical change.
  # ============================================================================
  format-fidelity:
    name: Format Fidelity
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Check format fidelity
        run: npm run format:fidelity

  verify-clean:
    name: Verify Clean
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Download generated test files
        uses: actions/download-artifact@v4
        with:
          name: generated-test-files
          path: tests

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes detected!"
            git status --porcelain
            echo ""
            echo "Run 'npm run antlr:all' and 'npm test' locally, then commit."
            echo "If expected output changed, run 'npm run test:update' first."
            exit 1
          fi
          echo "✅ No uncommitted changes"

  # ============================================================================
  # STAGE 3 (parallel): Analysis that needs generated files
  # ============================================================================
  c-validation:
    name: C Static Analysis (${{ matrix.tool }})
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [integration]
    # Advisory: pre-existing MISRA violations exist; don't block PR merges
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Note: 'misra' is a cppcheck addon, not a standalone tool
        # batch-validate.ts handles this dependency automatically
        tool: [cppcheck, clang-tidy, misra, flawfinder]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm dependencies
        # Issue #1421: self-hosted keeps ~/.npm between jobs; see top of file.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install C analysis tools
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-tidy flawfinder

      - name: Download generated test files
        uses: actions/download-artifact@v4
        with:
          name: generated-test-files
          path: tests

      - name: Run validation
        env:
          TOOL: ${{ matrix.tool }}
        run: npm run validate:c -- --tool "$TOOL"

  # Fork pull requests get no SONAR_TOKEN here; sonar.yml scans them on
  # workflow_run instead (#1680), so this job never runs for one.
  sonar:
    name: SonarCloud
    runs-on: self-hosted
    needs: [unit-tests]
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # FINAL: All checks must pass
  # ============================================================================
  all-checks-passed:
    name: All Checks Passed
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs:
      [
        lint,
        build,
        integration,
        unit-tests,
        cli-tests,
        grammar-coverage,
        format-fidelity,
        verify-clean,
        c-validation,
        sonar,
      ]
    if: always()

    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "## Results"
          FAILED=0
          [ "${{ needs.lint.result }}" != "success" ] && echo "❌ Static Analysis" && FAILED=1 || echo "✅ Static Analysis"
          [ "${{ needs.build.result }}" != "success" ] && echo "❌ Build" && FAILED=1 || echo "✅ Build"
          [ "${{ needs.integration.result }}" != "success" ] && echo "❌ Integration Tests" && FAILED=1 || echo "✅ Integration Tests"
          [ "${{ needs.unit-tests.result }}" != "success" ] && echo "❌ Unit Tests" && FAILED=1 || echo "✅ Unit Tests"
          [ "${{ needs.cli-tests.result }}" != "success" ] && echo "❌ CLI Tests" && FAILED=1 || echo "✅ CLI Tests"
          [ "${{ needs.grammar-coverage.result }}" != "success" ] && echo "❌ Grammar Coverage" && FAILED=1 || echo "✅ Grammar Coverage"
          [ "${{ needs.format-fidelity.result }}" != "success" ] && echo "❌ Format Fidelity" && FAILED=1 || echo "✅ Format Fidelity"
          [ "${{ needs.verify-clean.result }}" != "success" ] && echo "❌ Verify Clean" && FAILED=1 || echo "✅ Verify Clean"
          [ "${{ needs.c-validation.result }}" != "success" ] && echo "⚠️ C Static Analysis (advisory)" || echo "✅ C Static Analysis"
          # A fork's Sonar job is skipped by design: sonar.yml scans it, and the ruleset requires the App's "SonarCloud Code Analysis" check (#1680).
          [ "${{ needs.sonar.result }}" != "success" ] && ! { [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] && [ "${{ needs.sonar.result }}" = "skipped" ]; } && echo "❌ SonarCloud" && FAILED=1 || echo "✅ SonarCloud"
          [ $FAILED -eq 1 ] && exit 1 || echo "::notice::All checks passed!"

  # ============================================================================
  # DEPLOY: Coverage to GitHub Pages (only on push to main)
  # ============================================================================
  deploy-coverage:
    name: Deploy Coverage
    runs-on: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Prevent concurrent Pages deployments
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./pages/coverage

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload coverage to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
