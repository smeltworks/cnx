name: SonarCloud

# #1680: GitHub gives a pull_request run from a FORK no repository secrets, so
# a Sonar job inside pr-checks.yml cannot authenticate there and every fork PR
# failed it. This workflow runs after PR Quality Checks completes, in the base
# repository's context and WITH SONAR_TOKEN, and scans every pull request (fork
# or not) and every push -- one path, whoever opened the PR. (pr-checks.yml
# keeps its old job for one cycle; see sonar-workflow.test.ts.)
#
# For a fork, the fork's files are on disk while the token is in scope, so:
#   - nothing from the checkout is executed: no npm/node step, ever
#   - Sonar settings come from the default branch (-Dproject.settings). The
#     fork's sonar-project.properties could otherwise set sonar.host.url (send
#     the token elsewhere) or sonar.nodejs.executable (run its own binary)
#   - no event payload is interpolated into a script: head_branch is chosen by
#     the fork's author, so it reaches the shell only through env
#   - GitHub-hosted runner only
# Known ceiling: the coverage report was produced by the fork's own run, so a
# fork can misreport its coverage. It cannot reach the token through it.
#
# workflow_run runs from the DEFAULT BRANCH's copy of this file, so a change
# here takes effect only once merged.

on:
  workflow_run:
    workflows: [PR Quality Checks]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write # to report the scan's outcome on the analyzed commit

jobs:
  scan:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Not a cancelled run: pr-checks.yml cancels a PR's older run when a newer
    # one starts, and that run left no coverage to scan. The newer run's scan
    # reports on the same context.
    if: github.event.workflow_run.conclusion != 'cancelled' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push')

    steps:
      # A push is analyzed as its branch. A pull request is found by its head,
      # because workflow_run.pull_requests is empty for a fork, and must be
      # exactly one open PR at the commit PR Quality Checks ran on.
      - name: Resolve what to analyze
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            params=$(jq -cn --arg branch "$HEAD_BRANCH" --arg sha "$HEAD_SHA" \
              '{"sonar.branch.name": $branch, "sonar.scm.revision": $sha}')
            echo "params=$params" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matches=$(gh api --paginate --method GET "repos/$REPO/pulls" \
            -f state=open -f "head=$HEAD_OWNER:$HEAD_BRANCH" -F per_page=100 \
            --jq '.[] | select(.head.sha == env.HEAD_SHA) | {number, base: .base.ref, branch: .head.ref} | @json')
          count=$(printf '%s\n' "$matches" | grep -c .)
          if [ "$count" -eq 0 ]; then
            # The PR this run belongs to merged or closed between PR Quality
            # Checks finishing and this workflow_run firing: nothing left to
            # scan, and not this job's failure.
            echo "::notice::no open PR at $HEAD_SHA; it was likely merged or closed before this scan ran"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=PR merged or closed before scan ran" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one open PR at $HEAD_SHA, found: $matches"
            exit 1
          fi
          number=$(printf '%s' "$matches" | jq -r .number)
          case "$number" in ''|*[!0-9]*) echo "::error::bad PR number"; exit 1 ;; esac
          echo "ref=refs/pull/$number/head" >> "$GITHUB_OUTPUT"
          # One line of JSON: jq escapes the branch name, and a git ref cannot
          # hold a newline, so it cannot break out of the output file.
          params=$(printf '%s' "$matches" | jq -c --arg sha "$HEAD_SHA" '{
            "sonar.pullrequest.key": (.number | tostring),
            "sonar.pullrequest.branch": .branch,
            "sonar.pullrequest.base": .base,
            "sonar.scm.revision": $sha
          }')
          echo "params=$params" >> "$GITHUB_OUTPUT"

      # PR Quality Checks can finish without ever uploading coverage-report
      # (it failed before that step, or didn't run), and that run's own
      # conclusion already carries the failure -- downloading an artifact that
      # was never produced must not also fail this job.
      - name: Check coverage artifact exists
        id: artifact
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "coverage-report")] | length')
          if [ "$count" -eq 0 ]; then
            echo "::notice::no coverage-report artifact on run $RUN_ID; PR Quality Checks produced none to scan"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=PR Quality Checks produced no coverage-report artifact" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the analyzed commit
        if: steps.target.outputs.skip != 'true' && steps.artifact.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0 # full history: blame data, and the base branch for new-code detection
          persist-credentials: false
          # Required to check out a fork's code from workflow_run. The risk it
          # names is EXECUTING that code with the token in scope; this workflow
          # only reads it (see the header), and sonar-workflow.test.ts holds
          # each property that keeps it that way. This step only, never another.
          allow-unsafe-pr-checkout: true

      - name: Assert checkout matches the analyzed run
        if: steps.target.outputs.skip != 'true' && steps.artifact.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$HEAD_SHA" ]; then
            echo "::error::checked out $actual, PR Quality Checks ran on $HEAD_SHA"
            exit 1
          fi

      - name: Checkout trusted Sonar settings
        if: steps.target.outputs.skip != 'true' && steps.artifact.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .sonar-trusted
          sparse-checkout: sonar-project.properties
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download coverage artifact
        if: steps.target.outputs.skip != 'true' && steps.artifact.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: SonarCloud Scan
        if: steps.target.outputs.skip != 'true' && steps.artifact.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: -Dproject.settings=.sonar-trusted/sonar-project.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONARQUBE_SCANNER_PARAMS: ${{ steps.target.outputs.params }}

      # A workflow_run's own result is reported on the default branch's commit,
      # not on the pull request, so without this a broken scan shows on the PR
      # only as a required check that never arrives. Posted for every outcome:
      # a status context keeps its last state, so failure-only would leave a
      # stale red after a successful re-run.
      - name: Report the outcome on the analyzed commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SKIP: ${{ steps.target.outputs.skip }}
          TARGET_REASON: ${{ steps.target.outputs.reason }}
          ARTIFACT_SKIP: ${{ steps.artifact.outputs.skip }}
          ARTIFACT_REASON: ${{ steps.artifact.outputs.reason }}
        run: |
          # A skip is not this job's failure -- the PR already merged, or the
          # run it would have scanned already reported its own problem -- so
          # it reports success with the reason, rather than a red status with
          # nothing behind it to investigate.
          if [ "$TARGET_SKIP" = "true" ]; then
            state=success
            description="Sonar scan: skipped -- $TARGET_REASON"
          elif [ "$ARTIFACT_SKIP" = "true" ]; then
            state=success
            description="Sonar scan: skipped -- $ARTIFACT_REASON"
          else
            case "$JOB_STATUS" in success) state=success ;; *) state=failure ;; esac
            description="Sonar scan: $JOB_STATUS"
          fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" -f context="SonarCloud scan (sonar.yml)" \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null
